name: StealthWhisper
options:
  bundleIdPrefix: com.stealth
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  WhisperCore:
    path: ../WhisperCore

targets:
  StealthWhisper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StealthWhisper
      - path: Shared
    dependencies:
      - package: WhisperCore
        product: WhisperCore
      - target: StealthWhisperWatch
        embed: true
      - target: StealthWhisperKeyboard
        embed: true
    info:
      path: StealthWhisper/Info.plist
      properties:
        CFBundleDisplayName: Stealth Whisper
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "9"
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.stealth.whisper.keyboard
            CFBundleURLSchemes:
              - stealthwhisper
        NSMicrophoneUsageDescription: "Stealth Whisper needs microphone access to record audio for transcription."
        NSSpeechRecognitionUsageDescription: "Stealth Whisper uses on-device speech recognition for fast private keyboard dictation."
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: StealthWhisper/StealthWhisper.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.stealth.whisper
        com.apple.developer.icloud-services:
          - CloudDocuments
        # `url(forUbiquityContainerIdentifier:)` returns nil without this
        # key regardless of the two above — it is the entitlement iCloud
        # Documents actually checks, and its absence is why history never
        # left the device that recorded it.
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.stealth.whisper
        com.apple.security.application-groups:
          - group.com.stealth.whisper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stealth.whisper
        CODE_SIGN_STYLE: Automatic
        # Kept here rather than only in Xcode's UI: regenerating the
        # project used to wipe the team and break every device build.
        DEVELOPMENT_TEAM: 9H5KVJSU9S
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
      gatherCoverageData: false

  StealthWhisperKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StealthWhisperKeyboard
      - path: Shared/Brand.swift
      - path: Shared/TextCleaner.swift
    info:
      path: StealthWhisperKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Stealth Whisper
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "9"
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    entitlements:
      path: StealthWhisperKeyboard/StealthWhisperKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.stealth.whisper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stealth.whisper.keyboard
        CODE_SIGN_STYLE: Automatic
        # Kept here rather than only in Xcode's UI: regenerating the
        # project used to wipe the team and break every device build.
        DEVELOPMENT_TEAM: 9H5KVJSU9S
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: YES
    scheme:
      testTargets: []
      gatherCoverageData: false

  StealthWhisperWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StealthWhisperWatch
      - path: Shared
    info:
      path: StealthWhisperWatch/Info.plist
      properties:
        CFBundleDisplayName: Stealth Whisper
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "9"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Stealth Whisper needs microphone access to record audio on your wrist."
        UIBackgroundModes:
          - audio
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.stealth.whisper
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: StealthWhisperWatch/StealthWhisperWatch.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.stealth.whisper
        com.apple.developer.icloud-services:
          - CloudDocuments
        # `url(forUbiquityContainerIdentifier:)` returns nil without this
        # key regardless of the two above — it is the entitlement iCloud
        # Documents actually checks, and its absence is why history never
        # left the device that recorded it.
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.stealth.whisper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stealth.whisper.watchkitapp
        CODE_SIGN_STYLE: Automatic
        # Kept here rather than only in Xcode's UI: regenerating the
        # project used to wipe the team and break every device build.
        DEVELOPMENT_TEAM: 9H5KVJSU9S
        SWIFT_VERSION: "5.0"
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
      gatherCoverageData: false
